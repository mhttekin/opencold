[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencold"
version = "0.1.0"
description = "CLI tool for generating personalized cold outreach emails using Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0",
    "typer>=0.15.0",
    "prompt_toolkit>=3.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "dnspython>=2.4",
    "ddgs>=9.0",
    "phonenumbers>=8.13",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-socket", "ruff==0.17.4", "pre-commit", "vcrpy"]
# Future: optional embeddings relevance-filter for ICP expansion (re-ranks
# candidates; keyless lexicon + Datamuse already cover the default path).
# expansion = ["sentence-transformers>=2.2"]

[project.scripts]
opencold = "opencold.cli:main"

[tool.setuptools.package-data]
opencold = ["*.csv"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opencold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
